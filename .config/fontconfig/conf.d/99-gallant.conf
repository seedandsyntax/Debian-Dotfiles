<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- HARD TARGET: Whitelist Gallant12 so Debian stops filtering it out -->
    <selectfont>
        <acceptfont>
            <pattern>
                <patelt name="family"><string>Gallant12</string></patelt>
            </pattern>
        </acceptfont>
    </selectfont>

    <!-- ASSIGNMENT SYSTEM: Lock the family name securely to itself -->
    <match target="pattern">
        <test name="family" qual="any">
            <string>Gallant12</string>
        </test>
        <edit name="family" mode="assign" binding="strong">
            <string>Gallant12</string>
        </edit>
    </match>

    <!-- ROUTING CHAIN: Route missing glyph pointers straight to True Vector Symbols -->
    <alias>
        <family>Gallant12</family>
        <prefer>
            <family>Gallant12</family>
            <family>Symbols Nerd Font</family>
        </prefer>
    </alias>
</fontconfig>
